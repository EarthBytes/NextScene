name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: recsys
          POSTGRES_PASSWORD: recsys
          POSTGRES_DB: recsys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recsys -d recsys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recsys:recsys@localhost:5432/recsys
      JWT_SECRET: ci-test-secret-with-32-characters-min
      ENVIRONMENT: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt
          pip install pytest ruff
      - name: Lint
        run: ruff check backend tests
      - name: Run database migrations
        run: PYTHONPATH=backend alembic upgrade head
      - name: Test
        run: PYTHONPATH=backend pytest tests -q --ignore=tests/test_clip_embeddings.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t nextscene-backend .
      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000 -t nextscene-frontend ./frontend
