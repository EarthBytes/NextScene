databases:
  - name: nextscene-db
    databaseName: nextscene
    user: nextscene
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: nextscene-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nextscene-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LOG_FORMAT
        value: json
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONPATH
        value: /app/backend
      - key: CORS_ORIGINS
        sync: false
